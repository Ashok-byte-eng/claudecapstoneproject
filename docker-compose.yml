version: "3.9"

services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone_dev_only}
      POSTGRES_DB: capstone
    ports:
      - "127.0.0.1:5432:5432"  # loopback-only — not reachable outside the host
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_only}
    ports:
      - "127.0.0.1:6379:6379"  # loopback-only — not reachable outside the host

volumes:
  pgdata:
